<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exemplo de módulos JavaScript com curso e seções">
  <title>Exemplo de Módulos: Curso e Seções</title>
  <link rel="stylesheet" href="modulos.css">
</head>

<body>
  <main>
    <h1 id="nomeCurso"></h1>
    <h2 id="codigoCurso"></h2>

    <div id="matricula">
      <p>Escolha uma seção:</p>

      <select id="numeroSecao"></select>

      <button id="matricularEstudante">Matricular Estudante</button>
      <button id="removerEstudante">Remover Estudante</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Seção</th>
          <th>Matriculado</th>
          <th>Instrutor</th>
        </tr>
      </thead>

      <tbody id="secoes"></tbody>
    </table>
  </main>

  <script type="module" src="scripts/modulos.mjs"></script>
</body>
</html>
